<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- スマホでのスクロールや拡大縮小を防ぐ -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>モンスターキャッチ！</title>
<style>
  /* --- ベーススタイル --- */
  * { box-sizing: border-box; }
  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: #222; font-family: 'Helvetica Neue', Arial, sans-serif;
    touch-action: none; /* スワイプ時のブラウザデフォルトの挙動を無効化 */
    overflow: hidden;
  }

  /* ゲームコンテナ：スマホ画面比率に合わせ、PCでも見やすくする */
  #app {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 500px;
    margin: 0 auto;
    background: #000;
    overflow: hidden;
    box-shadow: 0 0 20px rgba(0,0,0,0.8);
  }

  /* 画面切り替え用クラス */
  .screen {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: none;
  }
  .screen.active {
    display: block;
  }

  /* --- マップ画面 --- */
  #map-screen {
    /* 草原風のチェック柄背景 */
    background: repeating-linear-gradient(
      45deg,
      #7cb342,
      #7cb342 30px,
      #689f38 30px,
      #689f38 60px
    );
    cursor: crosshair;
  }

  /* マップ上のオブジェクト共通 */
  .entity {
    position: absolute;
    transform: translate(-50%, -50%);
    user-select: none;
    pointer-events: none; /* クリック判定はマップ自身で行うため */
  }

  /* プレイヤー */
  #player {
    font-size: 40px;
    z-index: 10;
    transition: transform 0.1s linear; /* 向き変更時のアニメーション */
  }
  
  /* マップ上のモンスター */
  .map-monster {
    font-size: 30px;
    z-index: 5;
    animation: bounce 1s infinite alternate ease-in-out;
  }

  /* マップの装飾（木や草） */
  .decoration {
    font-size: 24px;
    z-index: 1;
    opacity: 0.7;
  }

  @keyframes bounce {
    0% { transform: translate(-50%, -50%) scale(1); }
    100% { transform: translate(-50%, -60%) scale(1.1); }
  }

  /* --- 捕獲画面 --- */
  #catch-screen {
    /* 空と草むらのグラデーション */
    background: linear-gradient(to bottom, #87CEEB 0%, #87CEEB 55%, #2e8b57 55%, #2e8b57 100%);
  }

  /* エンカウントしたモンスター */
  #target-monster {
    position: absolute;
    top: 30%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 100px;
    transition: transform 0.3s ease, opacity 0.3s ease;
    animation: float 2s infinite ease-in-out;
    z-index: 5;
  }
  @keyframes float {
    0%, 100% { transform: translate(-50%, -50%); }
    50% { transform: translate(-50%, -60%); }
  }

  /* モンスターボール */
  #ball {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    border: 4px solid #222;
    /* 上が赤、下が白のグラデーション */
    background: linear-gradient(to bottom, #ff3b30 46%, #222 46%, #222 54%, #ffffff 54%);
    position: absolute;
    bottom: 40px;
    left: calc(50% - 35px);
    box-shadow: 0 10px 15px rgba(0,0,0,0.4);
    z-index: 20;
    touch-action: none; /* ドラッグ操作用 */
    cursor: grab;
  }
  #ball:active { cursor: grabbing; }

  /* ボールの真ん中のボタン */
  #ball::after {
    content: '';
    width: 18px;
    height: 18px;
    background: #fff;
    border: 3px solid #222;
    border-radius: 50%;
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
  }

  /* ボール揺れアニメーション */
  .shake {
    animation: roll 1.2s ease-in-out;
  }
  @keyframes roll {
    0% { transform: translate(-50%, -50%) rotate(0deg); }
    20% { transform: translate(-50%, -50%) rotate(-30deg); }
    40% { transform: translate(-50%, -50%) rotate(30deg); }
    60% { transform: translate(-50%, -50%) rotate(-15deg); }
    80% { transform: translate(-50%, -50%) rotate(15deg); }
    100% { transform: translate(-50%, -50%) rotate(0deg); }
  }

  /* 捕獲成功時の星エフェクト */
  #capture-effect {
    position: absolute;
    top: 40%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 80px;
    display: none;
    z-index: 15;
    animation: pop 0.5s ease-out forwards;
  }
  @keyframes pop {
    0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
  }

  /* --- UI要素 --- */
  #ui-layer {
    position: absolute;
    top: 15px; left: 15px; right: 15px;
    display: flex;
    justify-content: space-between;
    z-index: 100;
    pointer-events: none; /* ボタン以外はクリック貫通 */
  }

  .panel {
    background: rgba(255, 255, 255, 0.9);
    padding: 8px 15px;
    border-radius: 25px;
    font-weight: bold;
    border: 2px solid #222;
    pointer-events: auto;
    box-shadow: 0 4px 6px rgba(0,0,0,0.2);
  }

  #btn-run {
    cursor: pointer;
    background: #ffcc00;
  }
  #btn-run:active { background: #e6b800; }

  /* メッセージ表示ボックス */
  #message-box {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0, 0, 0, 0.85);
    color: white;
    padding: 20px 30px;
    border-radius: 10px;
    font-size: 20px;
    font-weight: bold;
    text-align: center;
    border: 2px solid #fff;
    z-index: 200;
    display: none;
    white-space: nowrap;
  }
</style>
</head>
<body>

<div id="app">
  <!-- UIレイヤー (常に最前面) -->
  <div id="ui-layer">
    <div class="panel">🏆 スコア: <span id="score-display">0</span></div>
    <div class="panel" id="btn-run" style="display:none;" onclick="runAway()">🏃 逃げる</div>
  </div>

  <!-- マップ画面 -->
  <div id="map-screen" class="screen active">
    <div id="player">🚶</div>
    <!-- 背景の木やモンスターはJSで生成されます -->
  </div>

  <!-- 捕獲画面 -->
  <div id="catch-screen" class="screen">
    <div id="target-monster"></div>
    <div id="capture-effect">✨</div>
    <div id="ball"></div>
  </div>

  <!-- メッセージ -->
  <div id="message-box"></div>
</div>

<script>
  /* =========================================
     ゲームデータと設定
  ========================================= */
  const monstersData = [
    { emoji: '🐛', name: 'イモムシ', catchRate: 0.8, score: 10, shadow: 'none' },
    { emoji: '🐭', name: 'ネズミ', catchRate: 0.7, score: 20, shadow: 'none' },
    { emoji: '🦊', name: 'キツネ', catchRate: 0.5, score: 50, shadow: '0 0 15px orange' },
    { emoji: '🐢', name: 'カメ', catchRate: 0.4, score: 100, shadow: '0 0 15px cyan' },
    { emoji: '🦖', name: 'ダイナソー', catchRate: 0.2, score: 300, shadow: '0 0 20px red' },
    { emoji: '🦄', name: 'ユニコーン', catchRate: 0.05, score: 1000, shadow: '0 0 30px magenta' }
  ];

  const app = document.getElementById('app');
  const mapScreen = document.getElementById('map-screen');
  const playerEl = document.getElementById('player');
  const catchScreen = document.getElementById('catch-screen');
  const targetMonsterEl = document.getElementById('target-monster');
  const ball = document.getElementById('ball');
  const messageBox = document.getElementById('message-box');
  const scoreDisplay = document.getElementById('score-display');
  const btnRun = document.getElementById('btn-run');
  const captureEffect = document.getElementById('capture-effect');

  // アプリケーションのサイズ（座標計算用）
  let appWidth = app.clientWidth;
  let appHeight = app.clientHeight;

  // ゲーム状態
  let currentScreen = 'map'; // 'map' or 'catch'
  let score = 0;
  
  /* =========================================
     マップ画面のロジック
  ========================================= */
  let playerX = appWidth / 2;
  let playerY = appHeight / 2;
  let targetX = playerX;
  let targetY = playerY;
  const playerSpeed = 3;
  let activeMonsters = [];

  // 初期化：背景の木や草をランダム配置
  function initMapDecorations() {
    for(let i = 0; i < 25; i++) {
      const deco = document.createElement('div');
      deco.textContent = Math.random() > 0.6 ? '🌲' : '🌿';
      deco.className = 'entity decoration';
      deco.style.left = (Math.random() * 100) + '%';
      deco.style.top = (Math.random() * 100) + '%';
      mapScreen.appendChild(deco);
    }
  }

  // マップをクリック・タップした位置へ移動先を更新
  mapScreen.addEventListener('pointerdown', (e) => {
    if (currentScreen !== 'map') return;
    const rect = app.getBoundingClientRect();
    targetX = e.clientX - rect.left;
    targetY = e.clientY - rect.top;
  });

  // メインループ（プレイヤーの移動とエンカウント判定）
  function gameLoop() {
    if (currentScreen === 'map') {
      const dx = targetX - playerX;
      const dy = targetY - playerY;
      const distance = Math.hypot(dx, dy);

      if (distance > playerSpeed) {
        playerX += (dx / distance) * playerSpeed;
        playerY += (dy / distance) * playerSpeed;
        
        // 移動方向によってプレイヤーの向きを変える
        if (dx > 0) playerEl.style.transform = 'translate(-50%, -50%) scaleX(1)';
        else if (dx < 0) playerEl.style.transform = 'translate(-50%, -50%) scaleX(-1)';
      } else {
        playerX = targetX;
        playerY = targetY;
      }

      playerEl.style.left = playerX + 'px';
      playerEl.style.top = playerY + 'px';

      checkEncounter();
    }
    requestAnimationFrame(gameLoop);
  }

  // モンスターをマップに湧かせる
  function spawnMonster() {
    if (currentScreen !== 'map' || activeMonsters.length >= 6) return;
    
    // レアリティの重み付け（簡易的にランダム抽出）
    const rand = Math.random();
    let mData = monstersData[0];
    if (rand > 0.95) mData = monstersData[5]; // ユニコーン
    else if (rand > 0.8) mData = monstersData[4]; // ダイナソー
    else if (rand > 0.6) mData = monstersData[3]; // カメ
    else if (rand > 0.4) mData = monstersData[2]; // キツネ
    else if (rand > 0.2) mData = monstersData[1]; // ネズミ

    const el = document.createElement('div');
    el.className = 'entity map-monster';
    el.textContent = mData.emoji;
    el.style.textShadow = mData.shadow;
    
    const x = Math.random() * (appWidth - 60) + 30;
    const y = Math.random() * (appHeight - 60) + 30;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    
    mapScreen.appendChild(el);
    activeMonsters.push({ el, x, y, data: mData });
  }

  // プレイヤーとモンスターの距離をチェック
  function checkEncounter() {
    for (let i = 0; i < activeMonsters.length; i++) {
      const m = activeMonsters[i];
      const dist = Math.hypot(m.x - playerX, m.y - playerY);
      // 距離が近い（接触した）場合
      if (dist < 40) {
        startCatchScreen(m, i);
        break;
      }
    }
  }

  /* =========================================
     捕獲画面のロジック
  ========================================= */
  let currentTarget = null;
  let isDragging = false;
  let isThrowing = false;
  let startX, startY;
  const initialBallY = appHeight - 75; // ボールの初期Y座標の中心付近

  function startCatchScreen(monsterObj, index) {
    currentScreen = 'catch';
    currentTarget = monsterObj.data;
    
    // マップから削除
    monsterObj.el.remove();
    activeMonsters.splice(index, 1);

    // 捕獲画面のセットアップ
    targetMonsterEl.textContent = currentTarget.emoji;
    targetMonsterEl.style.textShadow = currentTarget.shadow;
    targetMonsterEl.style.display = 'block';
    targetMonsterEl.style.transform = 'translate(-50%, -50%) scale(1)';
    targetMonsterEl.style.opacity = '1';

    mapScreen.classList.remove('active');
    catchScreen.classList.add('active');
    btnRun.style.display = 'block';

    resetBall();
    showMessage(`あ！野生の ${currentTarget.name} がとびだしてきた！`, 2000);
  }

  // ボールのドラッグ（スワイプ）操作
  ball.addEventListener('pointerdown', (e) => {
    if (currentScreen !== 'catch' || isThrowing) return;
    isDragging = true;
    startX = e.clientX;
    startY = e.clientY;
    ball.style.transition = 'none';
  });

  app.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    
    // ボールを指に追従させる (上に引っ張る操作のみ許可)
    if (dy < 10) {
      ball.style.transform = `translate(${dx}px, ${dy}px)`;
    }
  });

  app.addEventListener('pointerup', (e) => {
    if (!isDragging) return;
    isDragging = false;
    
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    
    // 上に素早く（大きく）スワイプした場合に投げる
    if (dy < -60) {
      throwBall(dx, dy);
    } else {
      resetBall();
    }
  });

  function throwBall(dx, dy) {
    isThrowing = true;
    
    // ボールを奥へ飛ばすアニメーション
    ball.style.transition = 'transform 0.5s cubic-bezier(0.2, 0.8, 0.4, 1)';
    
    // dxのブレを強調し、スケールを小さくして奥へ行く表現
    const finalX = dx * 1.5;
    const finalY = dy * 1.5;
    ball.style.transform = `translate(${finalX}px, ${finalY}px) scale(0.4)`;
    
    // アニメーション完了後に判定
    setTimeout(() => {
      // 判定: 十分奥に投げられており、かつ横ズレが少ないか
      if (finalY < -200 && Math.abs(finalX) < 120) {
        processHit();
      } else {
        processMiss();
      }
    }, 500);
  }

  function processHit() {
    // ターゲットをボールに吸い込む演出
    targetMonsterEl.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
    targetMonsterEl.style.transform = 'translate(-50%, -50%) scale(0)';
    targetMonsterEl.style.opacity = '0';

    // ボールが地面に落ちてくる演出
    setTimeout(() => {
      ball.style.transition = 'transform 0.4s cubic-bezier(0.5, 0, 1, 1)';
      // 画面中央付近に落下させる
      ball.style.transform = `translate(0, -250px) scale(0.6)`;
      
      // 落ちた後、ボールが揺れる
      setTimeout(() => {
        ball.classList.add('shake');
        
        // 揺れ終わったあとの捕獲判定
        setTimeout(() => {
          ball.classList.remove('shake');
          
          if (Math.random() < currentTarget.catchRate) {
            // 捕獲成功
            captureEffect.style.display = 'block';
            showMessage(`やったー！\n${currentTarget.name} を捕まえた！`, 2500);
            updateScore(currentTarget.score);
            setTimeout(() => {
              captureEffect.style.display = 'none';
              returnToMap();
            }, 2500);
          } else {
            // 捕獲失敗（逃げられた）
            showMessage(`ああっ！\n${currentTarget.name} に逃げられた！`, 2000);
            targetMonsterEl.style.transform = 'translate(-50%, -50%) scale(1)';
            targetMonsterEl.style.opacity = '1';
            
            setTimeout(() => {
              returnToMap();
            }, 2000);
          }
        }, 1200); // 揺れアニメーションの時間
      }, 400);
    }, 300);
  }

  function processMiss() {
    showMessage("外れた！", 1000);
    setTimeout(resetBall, 1000);
  }

  function resetBall() {
    ball.style.transition = 'transform 0.3s ease';
    ball.style.transform = 'translate(0, 0) scale(1)';
    isThrowing = false;
  }

  /* =========================================
     共通・UIロジック
  ========================================= */
  function updateScore(points) {
    score += points;
    scoreDisplay.textContent = score;
  }

  function showMessage(text, duration) {
    messageBox.innerText = text;
    messageBox.style.display = 'block';
    if (duration) {
      setTimeout(() => {
        messageBox.style.display = 'none';
      }, duration);
    }
  }

  function runAway() {
    if (isThrowing) return;
    showMessage("逃げ出した！", 1500);
    setTimeout(returnToMap, 1500);
  }

  function returnToMap() {
    currentScreen = 'map';
    catchScreen.classList.remove('active');
    mapScreen.classList.add('active');
    btnRun.style.display = 'none';
    
    // 同じモンスターに連続でエンカウントしないようプレイヤー位置を少しずらす
    playerY += 60;
    targetY = playerY;
  }

  // 画面リサイズ対応
  window.addEventListener('resize', () => {
    appWidth = app.clientWidth;
    appHeight = app.clientHeight;
  });

  /* =========================================
     ゲーム開始処理
  ========================================= */
  initMapDecorations();
  setInterval(spawnMonster, 3000); // 3秒ごとにモンスター発生を試行
  requestAnimationFrame(gameLoop); // メインループ開始
  
  // 初回案内
  setTimeout(() => {
    showMessage("マップをタップして移動し、\nモンスターを探そう！", 3000);
  }, 500);

</script>
</body>
</html>
